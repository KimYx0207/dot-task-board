name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm run check
      - run: npm run check:public
      - run: npm run build
      - run: npm test
      - run: node --check dist/server/index.js
      - run: node --check dist/sites/index.js
      - run: node --check dist/candidate/index.js
      - run: SITE_BRIDGE_COMPILED=true MANUAL_CHECK_COMPILED=true node --test tests/sites-event-bridge.test.mjs tests/manual-task-check.test.mjs
